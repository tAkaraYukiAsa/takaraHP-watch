name: Watch Takarazuka Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  check-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Get visible text from NTA
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup

          url = "https://www.nta.co.jp/jrodekakenet/plan/takarazukakageki/"

          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=60
          )
          r.raise_for_status()

          soup = BeautifulSoup(r.text, "html.parser")

          for tag in soup(["script", "style", "noscript"]):
              tag.decompose()

          text = "\n".join(
              line.strip()
              for line in soup.get_text("\n").splitlines()
              if line.strip()
          )

          with open("nta_current.txt", "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Get visible text from Yomiuri
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://www.yomiuri-ryokou.co.jp/r/tour-search/type-kokunai/detail_type-tour/dep_larg-kanto_koshin/dep_mid-tokyo/dst_larg-kanto_koshin/dst_mid-tokyo/freeword-%E5%AE%9D%E5%A1%9A/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  user_agent="Mozilla/5.0"
              )

              page.goto(
                  url,
                  wait_until="networkidle",
                  timeout=120000
              )

              text = page.locator("body").inner_text()

              text = "\n".join(
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              )

              with open(
                  "yomiuri_current.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(text)

              browser.close()
          PY

      - name: Create hashes
        run: |
          shasum -a 256 nta_current.txt | awk '{print $1}' > nta_current_hash.txt
          shasum -a 256 yomiuri_current.txt | awk '{print $1}' > yomiuri_current_hash.txt

      - name: Compare NTA page
        id: nta
        run: |
          CURRENT=$(cat nta_current_hash.txt)

          if [ ! -f last_hash_nta.txt ]; then
            echo "$CURRENT" > last_hash_nta.txt
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            PREVIOUS=$(cat last_hash_nta.txt)

            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "$CURRENT" > last_hash_nta.txt
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Compare Yomiuri page
        id: yomiuri
        run: |
          CURRENT=$(cat yomiuri_current_hash.txt)

          if [ ! -f last_hash_yomiuri.txt ]; then
            echo "$CURRENT" > last_hash_yomiuri.txt
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            PREVIOUS=$(cat last_hash_yomiuri.txt)

            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "$CURRENT" > last_hash_yomiuri.txt
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Notify NTA update
        if: steps.nta.outputs.changed == 'true'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: 日本旅行 宝塚ページ更新" \
            -H "Priority: high" \
            -H "Click: https://www.nta.co.jp/jrodekakenet/plan/takarazukakageki/" \
            -d "日本旅行の宝塚ページの表示内容が変わりました。" \
            "https://ntfy.sh/$TOPIC"

      - name: Notify Yomiuri update
        if: steps.yomiuri.outputs.changed == 'true'
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: 読売旅行 宝塚ページ更新" \
            -H "Priority: high" \
            -H "Click: https://www.yomiuri-ryokou.co.jp/r/tour-search/type-kokunai/detail_type-tour/dep_larg-kanto_koshin/dep_mid-tokyo/dst_larg-kanto_koshin/dst_mid-tokyo/freeword-%E5%AE%9D%E5%A1%9A/" \
            -d "読売旅行の宝塚検索ページの表示内容が変わりました。" \
            "https://ntfy.sh/$TOPIC"

      - name: Save new hashes
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com

          git add last_hash_nta.txt last_hash_yomiuri.txt

          git diff --cached --quiet && exit 0

          git commit -m "Update monitored page hashes"
          git push
